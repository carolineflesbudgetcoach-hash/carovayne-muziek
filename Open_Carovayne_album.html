<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Carovayne – De muziek van Lumivare</title><style>body{margin:0;background:radial-gradient(ellipse at top,#3d276d,#130f2a 65%);color:#f8f0ff;font-family:Georgia,serif;min-height:100vh}.wrap{max-width:730px;margin:auto;padding:28px 18px 60px;text-align:center}h1{font-size:clamp(28px,6vw,46px);letter-spacing:3px;color:#f6d998;margin:18px 0 4px}h2{font-size:23px;font-style:italic;font-weight:normal;margin:0 0 20px;color:#e7c5ff}.cover{width:min(100%,390px);aspect-ratio:1/1;object-fit:cover;border-radius:9px;box-shadow:0 15px 65px #0009;border:1px solid #d5b5ff77}.subtitle{color:#e1cbe9}.player{margin:22px auto;max-width:560px;background:#ffffff12;border:1px solid #e7caff55;border-radius:18px;padding:20px}.now{color:#f8d993;min-height:24px;font-size:18px}audio{width:100%;margin:12px 0}.controls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}button{font:inherit;cursor:pointer;border:1px solid #d5b6ef88;background:#49337d;color:white;border-radius:30px;padding:10px 19px}button:hover{background:#6850a1}.list{max-width:610px;margin:18px auto;text-align:left}.track{display:flex;align-items:center;gap:12px;padding:13px 9px;border-bottom:1px solid #ffffff24;cursor:pointer}.track:hover,.track.active{background:#ffffff15}.num{color:#e5bf86;width:25px}.name{flex:1}.time{color:#d2bde3}footer{color:#b9a3d2;font-size:13px;margin-top:25px}</style></head><body><main class="wrap"><img class="cover" src="hoes.jpg" alt="Magische Carovayne albumhoes"><h1>CAROVAYNE</h1><h2>De muziek van Lumivare</h2><p class="subtitle">Vijf originele muziekstukken · Totale speelduur 15:46</p><section class="player"><div class="now" id="now">Kies een muziekstuk</div><audio id="audio" controls preload="metadata"></audio><div class="controls"><button id="prev">◀ Vorige</button><button id="all">▶ Speel alles af</button><button id="next">Volgende ▶</button></div></section><div class="list" id="list"></div><footer>Caroline Fles-Eskes · Carovayne · Lumivare<br>Dit album werkt ook zonder internet. Bewaar de hele map bij elkaar.</footer></main><script>const tracks=[["De roep van Lumivare", "3:01", "Carovayne_De_roep_van_Lumivare_versie_11.mp3"], ["De magie van Lumivare", "2:57", "Carovayne_De_magie_van_Lumivare_versie_2.mp3"], ["De vlucht van de draken", "3:58", "Carovayne_De_vlucht_van_de_draken_versie_4.mp3"], ["De schaduw van de Veyrathi", "2:45", "Carovayne_De_schaduw_van_de_Veyrathi_versie_1.mp3"], ["Carovayne & Carlan – Twee werelden, één liefde", "3:05", "Carovayne_Carlan_Twee_werelden_een_liefde_v1.mp3"]];let index=-1,auto=true;const audio=document.getElementById('audio'),list=document.getElementById('list'),now=document.getElementById('now');function choose(i,play=true){index=i;audio.src=tracks[i][2];now.textContent=tracks[i][0];document.querySelectorAll('.track').forEach((e,j)=>e.classList.toggle('active',j===i));if(play)audio.play().catch(()=>{});}tracks.forEach((t,i)=>{const d=document.createElement('div');d.className='track';d.innerHTML='<span class="num">'+String(i+1).padStart(2,'0')+'</span><span class="name"></span><span class="time">'+t[1]+'</span>';d.querySelector('.name').textContent=t[0];d.onclick=()=>{auto=true;choose(i)};list.append(d)});document.getElementById('all').onclick=()=>{auto=true;choose(0)};document.getElementById('prev').onclick=()=>choose(Math.max(0,index-1));document.getElementById('next').onclick=()=>choose(index<0?0:Math.min(tracks.length-1,index+1));audio.addEventListener('ended',()=>{if(auto&&index<tracks.length-1)choose(index+1)});</script></body></html>
